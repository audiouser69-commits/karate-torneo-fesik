name: Build e release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: echo "VER=v$(node -p "require('./package.json').version")" >> $GITHUB_ENV
        shell: bash
      - run: npm ci
      - run: npm run dist:win
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item LEGGIMI.txt, modello_atleti.xlsx "dist/Karate Torneo FESIK-win32-x64/"
          Copy-Item live/index.html "dist/Karate Torneo FESIK-win32-x64/pagina_live_modello.html"
          Compress-Archive -Path "dist/Karate Torneo FESIK-win32-x64" -DestinationPath "KarateTorneoFESIK_Windows_${{ env.VER }}.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "KarateTorneoFESIK_Windows_*.zip" }

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: echo "VER=v$(node -p "require('./package.json').version")" >> $GITHUB_ENV
        shell: bash
      - run: npm ci
      - run: npm run dist:mac
      - name: Firma ad-hoc e zip
        run: |
          for a in arm64 x64; do
            D="dist/Karate Torneo FESIK-darwin-$a"
            codesign --force --deep -s - "$D/Karate Torneo FESIK.app"
            cp LEGGIMI.txt LEGGIMI_MAC.txt modello_atleti.xlsx "$D/"
          done
          (cd "dist/Karate Torneo FESIK-darwin-arm64" && ditto -c -k --sequesterRsrc --keepParent "Karate Torneo FESIK.app" app.zip && zip -q app.zip LEGGIMI.txt LEGGIMI_MAC.txt modello_atleti.xlsx && mv app.zip "$GITHUB_WORKSPACE/KarateTorneoFESIK_Mac_AppleSilicon_${{ env.VER }}.zip")
          (cd "dist/Karate Torneo FESIK-darwin-x64" && ditto -c -k --sequesterRsrc --keepParent "Karate Torneo FESIK.app" app.zip && zip -q app.zip LEGGIMI.txt LEGGIMI_MAC.txt modello_atleti.xlsx && mv app.zip "$GITHUB_WORKSPACE/KarateTorneoFESIK_Mac_Intel_${{ env.VER }}.zip")
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: "KarateTorneoFESIK_Mac_*.zip" }

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "VER=v$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: Karate Torneo FESIK ${{ env.VER }}
          body_path: .github/release-notes.md
          files: |
            out/*.zip
            docs/Guida_Karate_Torneo_FESIK.pdf
            docs/Guida_Karate_Torneo_FESIK_Mac.pdf
