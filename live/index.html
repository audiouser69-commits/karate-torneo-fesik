<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · Risultati live</title>
<style>
:root{--red:#d7261e;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--bg:#f3f4f6}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:#0b0f19;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px}header .sub{font-size:12.5px;color:#9ca3af}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ca3af;margin-right:6px}.dot.on{background:#22c55e;animation:p 1.5s infinite}@keyframes p{50%{opacity:.3}}
nav{display:flex;gap:6px;margin-top:10px}nav button{flex:1;border:0;background:#1f2937;color:#d1d5db;padding:8px;border-radius:8px;font:inherit;font-weight:600}nav button.a{background:var(--red);color:#fff}
main{padding:12px;max-width:980px;margin:0 auto}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
.card h3{margin:0;padding:10px 14px;font-size:14px;border-bottom:1px solid var(--line);background:#fafafa;display:flex;justify-content:space-between;gap:8px}
.live .sides{display:grid;grid-template-columns:1fr auto 1fr}
.side{padding:12px 14px}.side.aka{background:linear-gradient(160deg,#e3342b,#b4160f);color:#fff}.side.shiro{background:#fff}
.side .n{font-weight:800;font-size:16px}.side .c{font-size:12px;opacity:.8}
.side .sc{font-size:40px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}
.side .pen{font-size:11px;font-weight:700;margin-top:4px}.side .pen span{background:rgba(0,0,0,.15);padding:2px 6px;border-radius:5px;margin-right:4px}
.side.shiro .pen span{background:#eef0f4}
.clock{background:#111;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px 12px;min-width:92px}
.clock b{font-size:28px;font-variant-numeric:tabular-nums}.clock small{font-size:10px;letter-spacing:.12em;color:#9ca3af}
.win{background:#fef3c7;padding:8px 14px;font-weight:700}
.list .r{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#eef0f4;color:#4b5563;white-space:nowrap}
.pill.kata{background:#e0ecff;color:#1d4ed8}.pill.kumite{background:#fde8e7;color:var(--red)}.pill.ok{background:#dcfce7;color:#166534}.pill.run{background:#fef3c7;color:#92400e}
.m{border:1px solid var(--line);border-radius:10px;margin:8px 14px;overflow:hidden;font-size:14px}
.m div{display:flex;justify-content:space-between;padding:6px 10px}.m .a{border-left:5px solid var(--red)}.m .s{border-left:5px solid #cbd5e1;border-top:1px solid var(--line)}.m .w{font-weight:800;background:#f0fdf4}
.m .club{font-size:11px;color:var(--mute);margin-left:6px}
.rn{padding:10px 14px 0;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase}
.muted{color:var(--mute)}.empty{padding:30px;text-align:center;color:var(--mute)}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);font:inherit;margin-bottom:10px}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.back{border:0;background:none;color:var(--red);font:inherit;font-weight:700;padding:6px 0;cursor:pointer}
</style>
</head>
<body>
<header><h1 id="title">__TITLE__</h1><div class="sub"><span class="dot" id="dot"></span><span id="sub">Connessione…</span></div>
<nav><button data-v="live" class="a">● Live</button><button data-v="cats">Categorie</button><button data-v="med">Medagliere</button></nav></header>
<main id="main"><div class="empty">Caricamento…</div></main>
<!--__PIXELART__-->
<script>
const qs = new URLSearchParams(location.search);
const DB = (qs.get('db') || '__DB_URL__').replace(/\/+$/, ''), TID = qs.get('t') || '__TID__';
let data = {}, view = 'live', catSel = null, filter = '', recv = {};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = ms => { ms = Math.max(0, ms || 0); const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function setPath(obj, path, val) {
  const parts = path.split('/').filter(Boolean);
  if (!parts.length) return val;
  let o = obj; for (let i = 0; i < parts.length - 1; i++) { if (typeof o[parts[i]] !== 'object' || o[parts[i]] == null) o[parts[i]] = {}; o = o[parts[i]]; }
  if (val === null) delete o[parts[parts.length - 1]]; else o[parts[parts.length - 1]] = val;
  return obj;
}
// Lettura a intervalli (non tiene connessioni aperte: adatto a molti spettatori col piano gratuito)
const BASE = DB + '/tornei/' + encodeURIComponent(TID);
let known = {}, lastJson = '', online = false, tick = 0;
async function get(path) { const r = await fetch(BASE + path + '.json', { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return r.json(); }
function setOnline(ok) { online = ok; document.getElementById('dot').className = ok ? 'dot on' : 'dot'; if (!ok) document.getElementById('sub').textContent = 'Riconnessione…'; }
async function poll() {
  if (document.hidden) return;
  try {
    if (tick === 0) { // primo caricamento completo
      const all = await get('') || {}; data = all; known = Object.assign({}, all.ver || {});
    } else {
      data.live = await get('/live') || {};
      if (tick % 5 === 0) { // ogni 15 s: quali categorie sono cambiate
        const ver = await get('/ver') || {};
        const changed = Object.keys(ver).filter(id => ver[id] !== known[id]);
        data.categories = data.categories || {};
        for (const id of changed) { data.categories[id] = await get('/categories/' + id); known[id] = ver[id]; }
        Object.keys(data.categories).forEach(id => { if (!(id in ver) && Object.keys(ver).length) delete data.categories[id]; });
      }
      if (tick % 20 === 0) data.info = await get('/info') || data.info;
    }
    const now = Date.now(); Object.keys(data.live || {}).forEach(k => recv[k] = now);
    tick++; setOnline(true);
    const j = JSON.stringify([data.live, data.info, known, view, catSel]);
    if (j !== lastJson) { lastJson = j; renderSmart(); }
  } catch (e) { setOnline(false); }
}
let lastRendered = '';
function renderSmart() { const key = JSON.stringify(data); if (key === lastRendered) return; lastRendered = key; render(); }
function connect() { poll(); setInterval(poll, 3000); document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); }); }
function stamp(path) { const now = Date.now(); const m = (path || '').match(/^\/live\/([^\/]+)/); if (m) { recv[decodeURIComponent(m[1])] = now; return; } if (!path || path === '/' || path === '/live') Object.keys((data && data.live) || {}).forEach(k => recv[k] = now); }
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { view = b.dataset.v; catSel = null; document.querySelectorAll('nav button').forEach(x => x.classList.toggle('a', x === b)); render(); });
function cats() { const c = (data && data.categories) || {}; return Object.values(c).sort((a, b) => a.num - b.num); }
function nm(x) { return x ? esc(x.n) : '<i class="muted">—</i>'; }
function render() {
  const info = (data && data.info) || {};
  document.getElementById('title').textContent = info.name || document.title;
  document.getElementById('sub').textContent = [info.place, info.date && new Date(info.date).toLocaleDateString('it-IT')].filter(Boolean).join(' · ') || 'Risultati in diretta';
  const el = document.getElementById('main');
  if (view === 'live') el.innerHTML = liveView();
  else if (view === 'cats') el.innerHTML = catSel ? catView(cats().find(c => c.id === catSel)) : catsList();
  else el.innerHTML = medView();
  el.querySelectorAll('[data-c]').forEach(r => r.onclick = () => { catSel = r.dataset.c; view = 'cats'; document.querySelectorAll('nav button').forEach(x => x.classList.toggle('a', x.dataset.v === 'cats')); render(); scrollTo(0, 0); });
  mountInfos(el);
  const back = el.querySelector('.back'); if (back) back.onclick = () => { catSel = null; render(); };
  const f = el.querySelector('#f'); if (f) { f.oninput = () => { filter = f.value; const p = f.selectionStart; render(); const g = document.querySelector('#f'); g.focus(); g.setSelectionRange(p, p); }; }
}
const infoStops = {};
function mountInfos(el) {
  Object.values(infoStops).forEach(f => f && f()); for (const k in infoStops) delete infoStops[k];
  if (!window.InfoScreen) return;
  el.querySelectorAll('[data-info]').forEach(st => { const d = data.live[st.dataset.info]; if (d && d.info) infoStops[st.dataset.info] = InfoScreen.mount(st, d.info); });
}
function pens(s) { return ['JOGAI', 'ATENAI', 'MUBOBI'].map(l => { const n = s[l.toLowerCase()] || 0; return `<span style="${n ? 'background:#ffd60a;color:#111' : ''}">${l} ${n}</span>`; }).join(''); }
function liveView() {
  const L = (data && data.live) || {};
  const keys = Object.keys(L).sort();
  if (!keys.length) return '<div class="empty">Nessun tatami attivo al momento.</div>';
  return keys.map(k => {
    const d = L[k]; let body = '';
    const title = `<h3><span>TATAMI ${esc(d.tatami)}</span><span class="muted" style="font-weight:500">${d.catNum != null ? '#' + esc(d.catNum) + ' ' : ''}${esc(d.category || '')}${d.round ? ' · ' + esc(d.round) : ''}</span></h3>`;
    if (d.mode === 'info' && d.info) {
      return `<div class="card live"><h3><span>TATAMI ${esc(d.tatami)}</span><span class="muted" style="font-weight:500">${esc(d.info.title || '')}</span></h3><div class="stage" data-info="${esc(k)}"></div></div>`;
    }
    if (d.mode === 'kumite' || d.mode === 'flags') {
      let t = d.timeLeft; if (d.running && recv[k]) t -= Date.now() - recv[k];
      const center = d.mode === 'kumite' ? `<div class="clock"><b data-clock="${k}">${fmt(t)}</b><small>${d.phase === 'encho' ? 'ENCHO-SEN' : d.running ? 'HAJIME' : 'YAME'}</small></div>` : '<div class="clock"><b>KATA</b><small>BANDIERINE</small></div>';
      const sc = s => d.mode === 'kumite' ? `${s.ippon} - ${s.wazaari}` : (d.flagsShown ? (s === d.aka ? d.flags.aka : d.flags.shiro) : '');
      body = `<div class="sides"><div class="side aka"><div class="n">${esc(d.aka.name)}</div><div class="c">${esc(d.aka.club)}</div><div class="sc">${sc(d.aka)}</div><div class="pen">${d.mode === 'kumite' ? pens(d.aka) : ''}</div></div>${center}<div class="side shiro"><div class="n">${esc(d.shiro.name)}</div><div class="c">${esc(d.shiro.club)}</div><div class="sc">${sc(d.shiro)}</div><div class="pen">${d.mode === 'kumite' ? pens(d.shiro) : ''}</div></div></div>`
        + (d.winner ? `<div class="win">🏁 ${d.winner === 'draw' ? 'Hikiwake' : 'Vince ' + esc(d[d.winner].name)} ${d.decision ? '· ' + esc(d.decision) : ''}</div>` : '');
    } else if (d.mode === 'kata') {
      body = `<div style="padding:14px"><div style="font-size:20px;font-weight:800">${esc(d.athlete)}</div><div class="muted">${esc(d.club)}</div>${d.show === 'score' && d.total != null ? `<div style="font-size:34px;font-weight:900;margin-top:6px">${d.dq ? 'Squalifica' : Number(d.total).toFixed(1)}</div><div class="muted">Voti: ${(d.scores || []).map(Number).map(x => x.toFixed(1)).join(' · ')}</div>` : '<div class="muted" style="margin-top:6px">In esecuzione…</div>'}</div>`;
    } else if (d.mode === 'kataList') {
      body = '<div class="list">' + (d.rank || []).map((r, i) => `<div class="r"><span><b>${i + 1}.</b> ${esc(r.n)}</span><b>${Number(r.t).toFixed(1)}</b></div>`).join('') + '</div>';
    } else if (d.mode === 'ranking') {
      body = '<div class="list">' + (d.ranking || []).slice(0, 4).map(r => `<div class="r"><span>${r.p === 1 ? '🥇' : r.p === 2 ? '🥈' : '🥉'} <b>${esc(r.n)}</b></span><span class="muted">${esc(r.c)}</span></div>`).join('') + '</div>';
    } else {
      body = '<div class="list">' + ((d.next || []).length ? d.next.map(n => `<div class="r"><span><b style="color:var(--red)">${esc(n.a)}</b> vs <b>${esc(n.s)}</b></span><span class="muted" style="font-size:12px">${esc(n.round)}</span></div>`).join('') : '<div class="empty">In pausa</div>') + '</div>';
      return `<div class="card live"><h3><span>TATAMI ${esc(d.tatami)}</span><span class="muted">prossimi incontri</span></h3>${body}</div>`;
    }
    return `<div class="card live">${title}${body}</div>`;
  }).join('');
}
setInterval(() => { const L = (data && data.live) || {}; document.querySelectorAll('[data-clock]').forEach(b => { const d = L[b.dataset.clock]; if (!d) return; let t = d.timeLeft; if (d.running && recv[b.dataset.clock]) t -= Date.now() - recv[b.dataset.clock]; b.textContent = fmt(t); }); }, 250);
function stPill(c) { return `<span class="pill ${c.status === 'conclusa' ? 'ok' : c.status === 'in corso' ? 'run' : ''}">${esc(c.status || '')}</span>`; }
function catsList() {
  const q = filter.toLowerCase();
  const list = cats().filter(c => !q || c.name.toLowerCase().includes(q) || (c.athletes || []).some(a => a && (a.n + ' ' + a.c).toLowerCase().includes(q)));
  return `<input id="f" placeholder="Cerca categoria, atleta o società…" value="${esc(filter)}"><div class="card list">${list.map(c => `<div class="r" data-c="${c.id}"><span><span class="pill ${c.discipline}">${c.discipline}</span> <b>#${c.num}</b> ${esc(c.name)} <span class="muted">(${c.count})</span></span>${stPill(c)}</div>`).join('') || '<div class="empty">Nessuna categoria</div>'}</div>`;
}
function mbox(m) {
  const sa = m.sc && m.sc[2] !== 'bye' ? `${Math.floor(m.sc[0] / 2)}-${m.sc[0] % 2}` : '', ss = m.sc && m.sc[2] !== 'bye' ? `${Math.floor(m.sc[1] / 2)}-${m.sc[1] % 2}` : '';
  return `<div class="m"><div class="a ${m.w === 'aka' ? 'w' : ''}"><span>${nm(m.a)}<span class="club">${m.a ? esc(m.a.c) : ''}</span></span><span>${sa}</span></div><div class="s ${m.w === 'shiro' ? 'w' : ''}"><span>${nm(m.s)}<span class="club">${m.s ? esc(m.s.c) : ''}</span></span><span>${ss}</span></div></div>`;
}
function catView(c) {
  if (!c) return '<button class="back">← Categorie</button><div class="empty">Categoria non trovata</div>';
  let h = `<button class="back">← Categorie</button><div class="card"><h3><span>#${c.num} ${esc(c.name)}</span>${stPill(c)}</h3>`;
  if (c.ranking && c.ranking.length) h += '<div class="list">' + c.ranking.map(r => `<div class="r"><span>${r.p === 1 ? '🥇' : r.p === 2 ? '🥈' : r.p === 3 ? '🥉' : r.p + '°'} <b>${nm(r.a)}</b> <span class="muted">${r.a ? esc(r.a.c) : ''}</span></span><span class="muted">${esc(r.note || '')}</span></div>`).join('') + '</div>';
  h += '</div>';
  if (c.kata) {
    c.kata.forEach(r => { if (!r.entries || !r.entries.length) return; h += `<div class="card"><h3>${esc(r.name)}</h3><div class="list">${r.entries.map((e, i) => `<div class="r"><span>${e.t != null ? '<b>' + (i + 1) + '.</b> ' : ''}${nm(e.n)}</span><b>${e.t != null ? Number(e.t).toFixed(1) : '—'}</b></div>`).join('')}</div></div>`; });
  } else if (c.matches && c.matches.length) {
    const ms = Object.values(c.matches).filter(m => !(m.bye && (!m.a || !m.s)));
    const groups = [];
    ms.forEach(m => { const key = m.t + '|' + (m.t === 'rep' ? m.rn : m.r); let g = groups.find(x => x.key === key); if (!g) groups.push(g = { key, name: m.rn, t: m.t, r: m.r, list: [] }); g.list.push(m); });
    groups.sort((a, b) => (a.t === 'rep') - (b.t === 'rep') || a.r - b.r);
    groups.forEach(g => { h += `<div class="card"><div class="rn">${esc(g.name)}</div>${g.list.sort((a, b) => a.i - b.i).map(mbox).join('')}<div style="height:8px"></div></div>`; });
  } else if (c.athletes) {
    h += '<div class="card list">' + c.athletes.map(a => `<div class="r"><span>${nm(a)}</span><span class="muted">${a ? esc(a.c) : ''}</span></div>`).join('') + '</div>';
  }
  return h;
}
function medView() {
  const t = {};
  cats().filter(c => c.status === 'conclusa').forEach(c => (c.ranking || []).forEach(r => { if (!r.a || r.p > 3) return; const k = r.a.c || '—'; t[k] = t[k] || [0, 0, 0]; t[k][r.p - 1]++; }));
  const rows = Object.entries(t).sort((a, b) => b[1][0] - a[1][0] || b[1][1] - a[1][1] || b[1][2] - a[1][2]);
  return `<div class="card list"><div class="r" style="font-weight:700;cursor:default"><span>Società</span><span>🥇 🥈 🥉</span></div>${rows.map(([k, v]) => `<div class="r" style="cursor:default"><span>${esc(k)}</span><span>${v[0]} &nbsp; ${v[1]} &nbsp; ${v[2]}</span></div>`).join('') || '<div class="empty">Nessuna categoria conclusa</div>'}</div>`;
}
if (DB.indexOf('_' + '_DB_URL') >= 0) document.getElementById('main').innerHTML = '<div class="empty">Pagina non configurata: creala dal programma (scheda Online → Crea pagina live).</div>';
else connect();
</script>
</body>
</html>
