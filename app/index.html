<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; connect-src *">
<title>Karate Torneo FESIK</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><div class="logo">空手</div><div><b>Torneo Karate</b><small>Regolamento FESIK</small></div></div>
    <nav id="nav">
      <button data-tab="torneo" class="active">🏆 Torneo</button>
      <button data-tab="atleti">👥 Atleti</button>
      <button data-tab="categorie">🗂️ Categorie</button>
      <button data-tab="tabellone">🌳 Tabellone</button>
      <button data-tab="incontro">⏱️ Incontro live</button>
      <button data-tab="grafiche">🖼️ Grafiche evento</button>
      <button data-tab="classifiche">🥇 Classifiche</button>
      <button data-tab="online">🔑 Account e online</button>
      <button data-tab="regole">⚙️ Regole</button>
    </nav>
    <div class="side-foot">
      <button id="btnBoard" class="primary wide">📺 Apri tabellone TV</button>
      <div class="row gap"><button id="btnBoardMove" class="small" title="Sposta il tabellone sull'altro schermo">↔ Schermo</button><button id="btnBoardWin" class="small" title="Apri in finestra (per prova)">🗗 Finestra</button></div>
      <div id="onAir" class="onair hidden"></div>
      <div id="syncStatus" class="sync off">Online: disattivato</div>
    </div>
  </aside>
  <main id="main">
    <section id="tab-torneo" class="tab active"></section>
    <section id="tab-atleti" class="tab"></section>
    <section id="tab-categorie" class="tab"></section>
    <section id="tab-tabellone" class="tab"></section>
    <section id="tab-incontro" class="tab"></section>
    <section id="tab-grafiche" class="tab"></section>
    <section id="tab-classifiche" class="tab"></section>
    <section id="tab-online" class="tab"></section>
    <section id="tab-regole" class="tab"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-box"><div id="modalBody"></div><div id="modalBtns" class="row gap end"></div></div></div>
<div id="toast"></div>
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="core.js"></script>
<script src="pixelart.js"></script>
<script src="infoscreen.js"></script>
<script src="app.js"></script>
</body>
</html>
