<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; connect-src *">
<title>Tabellone</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Segoe UI",Arial,sans-serif;cursor:none}
#root{position:absolute;inset:0;display:flex;flex-direction:column}
.top{height:8vh;background:#0b0f19;display:flex;align-items:center;justify-content:space-between;padding:0 2.2vw;font-size:2.3vh;letter-spacing:.03em}
.top .cat{font-weight:700;font-size:2.7vh;text-align:center;flex:1;padding:0 2vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tat{background:#d7261e;padding:.6vh 1.2vw;border-radius:.8vh;font-weight:700}
.arena{flex:1;display:flex;position:relative}
.half{flex:1;display:flex;flex-direction:column;padding:3vh 2.5vw 3vh;position:relative}
.aka{background:linear-gradient(170deg,#ea2a20 0%,#c3160d 100%)}
.shiro{background:#f6f7f9;color:#0d1117}
.tag{font-size:3vh;font-weight:800;letter-spacing:.2em;opacity:.85}
.name{font-size:5.6vh;font-weight:800;line-height:1.05;margin-top:.5vh;max-width:30vw;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.club{font-size:3vh;opacity:.8;margin-top:.3vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.half.shiro .tag,.half.shiro .name,.half.shiro .club{align-self:flex-end;text-align:right}
.score{flex:1;display:flex;align-items:center;justify-content:center;gap:2.5vw;margin-top:16vh}
.num{font-size:30vh;font-weight:900;line-height:.9;font-variant-numeric:tabular-nums;text-align:center;min-width:16vw}
.num small{display:block;font-size:2.6vh;font-weight:700;letter-spacing:.15em;opacity:.75;margin-top:1vh}
.dash{font-size:16vh;font-weight:900;opacity:.6;margin-bottom:4vh}
.pens{display:flex;gap:1vw;justify-content:center;flex-wrap:wrap}
.pen{font-size:2.5vh;font-weight:800;padding:1vh 1.3vw;border-radius:1vh;letter-spacing:.06em;background:rgba(0,0,0,.22);opacity:.55}
.shiro .pen{background:#e3e6eb}
.pen.on{background:#ffd60a!important;color:#111;opacity:1}
.pen.hs.on{background:#111!important;color:#ffd60a}
.dots{display:inline-flex;gap:.4vw;margin-left:.6vw;vertical-align:middle}
.dots i{width:1.6vh;height:1.6vh;border-radius:50%;border:.25vh solid currentColor;display:inline-block}
.dots i.f{background:currentColor}
.clockbox{position:absolute;left:50%;top:3vh;transform:translateX(-50%);background:#fff;color:#000;border-radius:2vh;padding:1.2vh 2.8vw 1.4vh;box-shadow:0 1.5vh 5vh rgba(0,0,0,.45);text-align:center;border:.6vh solid #111;min-width:30vw}
.clock{font-size:18vh;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:.02em}
.clock.warn{color:#d97706}.clock.end{color:#d7261e}
.phase{font-size:2.4vh;font-weight:800;letter-spacing:.2em;color:#555;margin-top:.4vh}
.phase.flash{color:#d7261e;animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.2}}
.run{position:absolute;top:1.4vh;right:1.4vw;width:2vh;height:2vh;border-radius:50%;background:#16a34a}
.winner{position:absolute;left:50%;top:33vh;transform:translateX(-50%);background:#111;color:#ffd60a;font-size:7vh;font-weight:900;padding:1.5vh 4vw;border-radius:2vh;letter-spacing:.06em;white-space:nowrap;box-shadow:0 2vh 6vh rgba(0,0,0,.5);border:.5vh solid #ffd60a}
.winner small{display:block;font-size:2.6vh;color:#fff;letter-spacing:.15em;text-align:center}
.half.won::after{content:"";position:absolute;inset:1.2vh;border:1.2vh solid #ffd60a;border-radius:2vh;pointer-events:none}
/* kata */
.kata{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1b2333,#05070c);padding:4vh}
.kata .who{font-size:9vh;font-weight:900;text-align:center;line-height:1.05}
.kata .meta{font-size:3.4vh;opacity:.75;margin-top:1vh}
.kata .scores{display:flex;gap:2vw;margin-top:6vh}
.kata .j{background:#fff;color:#111;border-radius:1.6vh;width:13vw;padding:1.5vh 0;text-align:center}
.kata .j b{display:block;font-size:9vh;font-weight:900;line-height:1}
.kata .j span{font-size:2.2vh;font-weight:700;color:#666;letter-spacing:.1em}
.kata .j.x{opacity:.35;text-decoration:line-through}
.kata .total{margin-top:5vh;font-size:16vh;font-weight:900;color:#ffd60a;line-height:1}
.kata .total small{display:block;font-size:2.6vh;color:#fff;letter-spacing:.2em;text-align:center;font-weight:700}
.list{width:70vw;margin-top:3vh}
.list .r{display:flex;justify-content:space-between;font-size:4vh;padding:1vh 2vw;border-bottom:.2vh solid rgba(255,255,255,.12)}
.list .r b{color:#ffd60a;margin-right:2vw}
/* flags */
.flag{font-size:26vh;font-weight:900;text-align:center;flex:1;display:flex;align-items:center;justify-content:center}
/* idle / ranking */
.idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%,#2a0c0a,#05070c 70%)}
.idle h1{font-size:9vh;font-weight:900;text-align:center;padding:0 4vw}
.idle .sub{font-size:3.4vh;opacity:.7;margin-top:1.5vh}
.idle .logo{width:16vh;height:16vh;border-radius:3vh;background:#d7261e;display:grid;place-items:center;font-size:7vh;font-weight:900;margin-bottom:4vh}
.nextt{margin-top:6vh;width:76vw}
.nextt h3{font-size:2.6vh;letter-spacing:.2em;opacity:.6;margin-bottom:1vh}
.nextt .r{display:flex;justify-content:space-between;font-size:3.2vh;padding:1.1vh 0;border-bottom:.2vh solid rgba(255,255,255,.1)}
.nextt .r span:last-child{opacity:.6;font-size:2.4vh}
.pod .r{font-size:5vh}

/* --- kumite: layout da schema (tatami / categoria+numero / atleti / tempo / penalità / punteggio) --- */
.kb-top{height:9vh;background:#0b0f19;display:flex;align-items:center;padding:0 2.2vw;gap:2vw;font-weight:800;letter-spacing:.04em}
.kb-top .tat{font-size:3.6vh;white-space:nowrap}
.kb-top .cat{flex:1;text-align:center;font-size:3.2vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-top .cat small{font-weight:600;opacity:.7;font-size:2.4vh}
.kb-top .num{font-size:4.4vh;border:.45vh solid #fff;border-radius:1vh;padding:.2vh 1.4vw;min-width:7vw;text-align:center;background:#d7261e;font-variant-numeric:tabular-nums}
.kb{flex:1;position:relative;display:flex}
.kb .side{flex:1;position:relative;padding:4vh 3vw 4vh}
.kb .side.aka{background:linear-gradient(170deg,#ea2a20 0%,#c3160d 100%);color:#fff}
.kb .side.shiro{background:#f6f7f9;color:#0d1117;text-align:right}
.kb .divider{position:absolute;left:50%;top:0;bottom:0;width:.7vh;margin-left:-.35vh;background:#0b0f19;z-index:2}
.kb .tag{font-size:2.6vh;font-weight:800;letter-spacing:.25em;opacity:.8}
.kb .name{font-size:7vh;font-weight:900;line-height:1.02;margin-top:.6vh;max-width:30vw;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kb .shiro .name{margin-left:auto}
.kb .club{font-size:3.4vh;opacity:.85;margin-top:.6vh;max-width:30vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb .shiro .club{margin-left:auto}
.kb .kps{position:absolute;bottom:5vh;display:flex;flex-direction:column;gap:1.4vh;font-size:4.2vh;font-weight:800;letter-spacing:.06em}
.kb .aka .kps{left:3vw}.kb .shiro .kps{right:3vw;align-items:flex-end}
.kb .kp{display:flex;align-items:center;gap:1.4vw;opacity:.8}
.kb .kp span{min-width:17vh}.kb .shiro .kp span{text-align:right}
.kb .kp b{display:inline-block;min-width:6.2vh;height:6.2vh;line-height:6.2vh;text-align:center;border-radius:1vh;background:rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.kb .shiro .kp b{background:#e3e6eb}
.kb .kp.on{opacity:1}.kb .kp.on b{background:#ffd60a!important;color:#111}
.kb .score{position:absolute;bottom:3vh;display:flex;flex-direction:column;align-items:center;font-size:34vh;font-weight:900;line-height:.85;font-variant-numeric:tabular-nums;text-align:center}
.kb .aka .score{right:5.5vw}.kb .shiro .score{left:5.5vw}
.kb .score small{display:block;white-space:nowrap;font-size:2.4vh;letter-spacing:.12em;font-weight:800;margin-top:.6vh;padding:.5vh .8vw;border-radius:.8vh;background:#ffd60a;color:#111;visibility:hidden}
.kb .score small.on{visibility:visible}
.kb .dashbar{position:absolute;left:50%;bottom:17vh;width:5vw;height:3.2vh;margin-left:-2.5vw;background:#0b0f19;border-radius:.6vh;z-index:3}
.kb .clockbox{position:absolute;left:50%;top:13vh;transform:translateX(-50%);background:#fff;color:#000;border:.7vh solid #0b0f19;border-radius:1.6vh;padding:1.4vh 2.6vw 1.6vh;text-align:center;min-width:28vw;z-index:4;box-shadow:0 1.5vh 5vh rgba(0,0,0,.4)}
.kb .side.won::after{content:"";position:absolute;inset:1.2vh;border:1.2vh solid #ffd60a;border-radius:2vh;pointer-events:none}
.kb .kwin{background:#111;color:#ffd60a;border-color:#ffd60a;padding:3.4vh 2.6vw}
.kb .kwin .wt{font-size:10vh;font-weight:900;letter-spacing:.04em;line-height:1}
.kb .kwin .phase{color:#fff;margin-top:1.2vh;text-transform:uppercase}
</style>
</head>
<body>
<div id="root"><div class="idle"><div class="logo">空手</div><h1>Tabellone pronto</h1><div class="sub">In attesa del primo incontro…</div></div></div>
<script src="vendor/qrcode.js"></script>
<script src="pixelart.js"></script>
<script src="infoscreen.js"></script>
<script>
const root = document.getElementById('root');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = ms => { ms = Math.max(0, ms || 0); const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
let lastBeep = 0, actx = null, lastInfo = null, stopInfo = null;
function beep(kind) {
  try {
    actx = actx || new AudioContext();
    (kind === 'end' ? [0, 0.45] : [0]).forEach(t0 => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'square'; o.frequency.value = kind === 'end' ? 880 : 660; g.gain.value = 0.15; o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + t0); o.stop(actx.currentTime + t0 + 0.35); });
  } catch (e) { }
}
function topBar(d) { return `<div class="top"><span>${esc(d.tournament)}</span><span class="cat">${esc(d.category || '')}${d.round ? ' · ' + esc(d.round) : ''}${d.type ? ' · ' + esc(d.type) : ''}</span><span class="tat">TATAMI ${esc(d.tatami)}</span></div>`; }
function dots(n, max) { let h = '<span class="dots">'; for (let i = 0; i < max; i++) h += `<i class="${i < n ? 'f' : ''}"></i>`; return h + '</span>'; }
function half(k, s, d) {
  const won = d.winner === k;
  return `<div class="half ${k} ${won ? 'won' : ''}">
    <div class="tag">${k === 'aka' ? 'AKA' : 'SHIRO'}</div><div class="name">${esc(s.name)}</div><div class="club">${esc(s.club)}</div>
    <div class="score"><div class="num">${s.ippon}<small>IPPON</small></div><div class="dash">-</div><div class="num">${s.wazaari}<small>WAZA-ARI</small></div></div>
    <div class="pens"><span class="pen ${s.atenai ? 'on' : ''}">ATENAI</span><span class="pen ${s.chui ? 'on' : ''}">CHUI</span><span class="pen ${s.jogai ? 'on' : ''}">JOGAI${dots(s.jogai, 4)}</span><span class="pen hs ${s.hansoku || s.kiken ? 'on' : ''}">${s.kiken ? 'KIKEN' : 'HANSOKU'}</span></div>
  </div>`;
}
function render(d) {
  if (d.beep && d.beep.id !== lastBeep) { if (lastBeep) beep(d.beep.kind); lastBeep = d.beep.id; }
  if (d.mode === 'info') {
    const key = JSON.stringify(d.info);
    if (key !== lastInfo) { lastInfo = key; if (stopInfo) stopInfo(); stopInfo = InfoScreen.mount(root, d.info); }
    return;
  }
  if (stopInfo) { stopInfo(); stopInfo = null; } lastInfo = null;
  if (d.mode === 'kumite') {
    const t = d.timeLeft, cls = t <= 0 ? 'end' : t <= 30000 ? 'warn' : '';
    const phase = d.phase === 'encho' ? '<div class="phase flash">ENCHO-SEN</div>' : d.phase === 'sai' ? '<div class="phase">SAI SHIAI</div>' : (d.atoshi && t > 0 ? '<div class="phase flash">ATOSHI BARAKU</div>' : '<div class="phase">' + (d.running ? 'HAJIME' : 'YAME') + '</div>');
    const win = d.winner ? `<div class="winner">${d.winner === 'draw' ? 'HIKIWAKE' : 'VINCE ' + (d.winner === 'aka' ? 'AKA' : 'SHIRO')}<small>${esc(d.decision || '')}</small></div>` : '';
    const pen = (lbl, n, right) => `<div class="kp ${n ? 'on' : ''}">${right ? `<b>${n || 0}</b><span>${lbl}</span>` : `<span>${lbl}</span><b>${n || 0}</b>`}</div>`;
    const side = (k, s) => `<div class="side ${k} ${d.winner === k ? 'won' : ''}">
        <div class="tag">${k === 'aka' ? 'AKA' : 'SHIRO'}</div><div class="name">${esc(s.name)}</div><div class="club">${esc(s.club)}</div>
        <div class="kps">${pen('JOGAI', s.jogai, k === 'shiro')}${pen('ATENAI', s.atenai, k === 'shiro')}${pen('MUBOBI', s.mubobi, k === 'shiro')}</div>
        <div class="score">${s.ippon}<small class="${s.wazaari ? 'on' : ''}">+ WAZA-ARI</small></div></div>`;
    root.innerHTML = `<div class="kb-top"><span class="tat">TATAMI ${esc(d.tatami)}</span><span class="cat">KUMITE · ${esc(d.categoryShort || d.category || '')}${d.round ? ' <small>· ' + esc(d.round) + '</small>' : ''}</span><span class="num">${d.catNum != null ? esc(d.catNum) : ''}</span></div>
      <div class="kb">${side('aka', d.aka)}${side('shiro', d.shiro)}<div class="divider"></div><div class="dashbar"></div>
      ${d.winner ? `<div class="clockbox kwin"><div class="wt">${d.winner === 'draw' ? 'HIKIWAKE' : 'VINCE ' + (d.winner === 'aka' ? 'AKA' : 'SHIRO')}</div><div class="phase">${esc(d.decision || '')} · ${fmt(t)}</div></div>`
        : `<div class="clockbox">${d.running ? '<span class="run"></span>' : ''}<div class="clock ${cls}">${fmt(t)}</div>${phase}</div>`}</div>`;
  } else if (d.mode === 'flags') {
    const show = d.flagsShown;
    root.innerHTML = topBar(d) + `<div class="arena">
      <div class="half aka ${d.winner === 'aka' ? 'won' : ''}"><div class="tag">AKA</div><div class="name">${esc(d.aka.name)}</div><div class="club">${esc(d.aka.club)}</div><div class="flag">${show ? d.flags.aka : ''}</div></div>
      <div class="half shiro ${d.winner === 'shiro' ? 'won' : ''}"><div class="tag">SHIRO</div><div class="name">${esc(d.shiro.name)}</div><div class="club">${esc(d.shiro.club)}</div><div class="flag">${show ? d.flags.shiro : ''}</div></div>
      ${show && d.winner ? `<div class="winner">VINCE ${d.winner === 'aka' ? 'AKA' : 'SHIRO'}<small>KATA · BANDIERINE</small></div>` : ''}</div>`;
  } else if (d.mode === 'kata') {
    const showScore = d.show === 'score' && d.total != null;
    let h = `<div class="kata"><div class="meta">KATA</div><div class="who">${esc(d.athlete)}</div><div class="meta">${esc(d.club)}${d.belt ? ' · Cintura ' + esc(d.belt) : ''}</div>`;
    if (showScore) {
      h += '<div class="scores">' + Array.from({ length: d.judges }, (_, i) => `<div class="j ${d.excluded.includes(i) ? 'x' : ''}"><b>${d.scores[i] != null ? Number(d.scores[i]).toFixed(1) : '-'}</b><span>GIUDICE ${i + 1}</span></div>`).join('') + '</div>';
      h += `<div class="total">${d.dq ? 'SQUALIFICA' : Number(d.total).toFixed(1)}<small>PUNTEGGIO</small></div>`;
    }
    root.innerHTML = topBar(d) + h + '</div>';
  } else if (d.mode === 'kataList') {
    root.innerHTML = topBar(d) + `<div class="kata"><div class="who" style="font-size:6vh">${esc(d.round)}</div><div class="list">${d.rank.map((r, i) => `<div class="r"><span><b>${i + 1}</b>${esc(r.n)}</span><span>${Number(r.t).toFixed(1)}</span></div>`).join('')}${d.waiting.map(n => `<div class="r" style="opacity:.5"><span>${esc(n)}</span><span>—</span></div>`).join('')}</div></div>`;
  } else if (d.mode === 'ranking') {
    const med = p => p === 1 ? '🥇' : p === 2 ? '🥈' : p === 3 ? '🥉' : p + '°';
    root.innerHTML = topBar(d) + `<div class="idle"><h1 style="font-size:6vh">CLASSIFICA</h1><div class="list pod">${d.ranking.slice(0, 8).map(r => `<div class="r"><span><b>${med(r.p)}</b>${esc(r.n)}</span><span style="opacity:.6;font-size:3vh">${esc(r.c)}</span></div>`).join('')}</div></div>`;
  } else {
    root.innerHTML = `<div class="idle"><div class="logo">空手</div><h1>${esc(d.tournament || 'Torneo di Karate')}</h1><div class="sub">${[d.place, d.date && new Date(d.date).toLocaleDateString('it-IT'), 'Tatami ' + d.tatami].filter(Boolean).map(esc).join(' · ')}</div>
     ${d.next && d.next.length ? `<div class="nextt"><h3>PROSSIMI INCONTRI</h3>${d.next.map(n => `<div class="r"><span><b style="color:#f87171">${esc(n.a)}</b> &nbsp;vs&nbsp; <b>${esc(n.s)}</b></span><span>${esc(n.cat)} · ${esc(n.round)}</span></div>`).join('')}</div>` : ''}</div>`;
  }
}
if (window.api && window.api.onBoard) window.api.onBoard(render);
window.renderBoard = render; // per anteprima
</script>
</body>
</html>
